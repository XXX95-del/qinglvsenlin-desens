services:
  desens-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: qinglvsenlin-desens-demo:latest
    container_name: desens-demo
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s